name: telecom-pipeline

services:
  postgres:
    image: postgres:16
    container_name: telecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"        # host:container — 5432 taken locally, so we use 5434
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: telecom-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "9000:9000"        # S3 API
      - "9001:9001"        # Web console
    volumes:
      - rustfsdata:/data
    mem_limit: 512m

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: telecom-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode
      - dev-container     # single-node dev mode — tiny footprint
      - --smp
      - "1"               # one CPU core
      - --memory
      - 512M              # hard RAM cap
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    mem_limit: 640m

volumes:
  pgdata:
  rustfsdata:
  redpandadata: